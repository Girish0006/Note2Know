{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Note2Know</title>
    <link rel="stylesheet" href="{% static 'portal/style.css' %}">
    <style>
        .role-toggle-container {
            display: flex;
            background: #F1F5F9;
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 24px;
            gap: 6px;
            border: 1px solid var(--border-light);
        }
        .role-btn {
            flex: 1;
            padding: 11px 14px;
            border: none;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .role-btn:hover {
            color: var(--primary);
        }
        .role-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, #4338CA 100%);
            color: #FFFFFF;
            font-weight: 700;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
    </style>
</head>
<body>

<nav class="topbar">
    <a href="{% url 'home' %}" class="brand">
        <div class="logo-box"><i class="fa-solid fa-book-bookmark"></i></div>
        <div>
            <h2>Note2Know</h2>
            <small>AI-Powered Learning Platform</small>
        </div>
    </a>

    <div>
        <a href="{% url 'home' %}" class="nav-btn"><i class="fa-solid fa-arrow-left" style="margin-right:4px;"></i> Back to Home</a>
    </div>
</nav>

<div class="container" style="max-width:440px; margin: 60px auto;">
    <div class="welcome-card" style="text-align:center;">
        <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 6px; color: var(--text-dark);">Welcome Back</h2>
        <p style="margin-bottom: 22px; color: var(--text-muted); font-size: 14.5px;">Log in to your Note2Know portal</p>

        <!-- Role Toggle Tabs -->
        <div class="role-toggle-container">
            <button type="button" class="role-btn {% if selected_role != 'staff' %}active{% endif %}" id="btn-student" onclick="setRole('student')">
                <i class="fa-solid fa-user-graduate"></i> Student
            </button>
            <button type="button" class="role-btn {% if selected_role == 'staff' %}active{% endif %}" id="btn-staff" onclick="setRole('staff')">
                <i class="fa-solid fa-chalkboard-user"></i> Faculty / Staff
            </button>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-error" style="margin-bottom:20px; font-size:14px; text-align:left;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <div>{{ message }}</div>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="role" id="role-input" value="{{ selected_role|default:'student' }}">
            
            <div style="margin-bottom: 18px; text-align: left;">
                <label id="username-label" style="display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; color: var(--text-dark);">
                    {% if selected_role == 'staff' %}Faculty / Staff ID{% else %}College ID (Student){% endif %}
                </label>
                <input type="text" name="username" id="username-input" class="form-control"
                       placeholder="{% if selected_role == 'staff' %}Enter Faculty / Staff ID{% else %}Enter College ID{% endif %}" 
                       value="{{ username|default:'' }}" required>
            </div>

            <div style="margin-bottom: 24px; text-align: left;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="font-weight: 600; font-size: 13.5px; color: var(--text-dark);">Password</label>
                    <a href="{% url 'forgot_password' %}" style="font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
                </div>
                <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="button" style="width: 100%; border: none; cursor: pointer; font-size: 15.5px; padding: 14px;">
                Log In <i class="fa-solid fa-right-to-bracket" style="margin-left: 6px;"></i>
            </button>
        </form>
    </div>
</div>

<script>
    function setRole(role) {
        document.getElementById('role-input').value = role;
        const btnStudent = document.getElementById('btn-student');
        const btnStaff = document.getElementById('btn-staff');
        const usernameLabel = document.getElementById('username-label');
        const usernameInput = document.getElementById('username-input');

        if (role === 'staff') {
            btnStaff.classList.add('active');
            btnStudent.classList.remove('active');
            if (usernameLabel) usernameLabel.innerText = "Faculty / Staff ID";
            if (usernameInput) usernameInput.placeholder = "Enter Faculty / Staff ID";
        } else {
            btnStudent.classList.add('active');
            btnStaff.classList.remove('active');
            if (usernameLabel) usernameLabel.innerText = "College ID (Student)";
            if (usernameInput) usernameInput.placeholder = "Enter College ID";
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        setRole('{{ selected_role|default:"student" }}');
    });
</script>

</body>
</html>
